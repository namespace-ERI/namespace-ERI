<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="title desc">
  <title id="title">Yuyang Hu — Research and GitHub statistics</title>
  <desc id="desc">4,931 project stars, 326 Google Scholar citations, 4,790 commits, and 10 research repositories</desc>
  <style>
    .value{font:700 30px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;fill:#172033}.label{font:500 12px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;fill:#687386;letter-spacing:.8px}.icon{font:400 18px -apple-system,BlinkMacSystemFont,Segoe UI Symbol,Arial,sans-serif;fill:#2a9d8f}.frame{fill:#fff;stroke:#d8dee8}.line{stroke:#e8ecf2}
    @media(prefers-color-scheme:dark){.value{fill:#e6edf3}.label{fill:#8b949e}.icon{fill:#5eead4}.frame{fill:#0d1117;stroke:#30363d}.line{stroke:#30363d}}
  </style>
  <rect class="frame" x=".5" y=".5" width="899" height="149" rx="10"/>
  <line class="line" x1="225" y1="27" x2="225" y2="123"/>
  <line class="line" x1="450" y1="27" x2="450" y2="123"/>
  <line class="line" x1="675" y1="27" x2="675" y2="123"/>
  <g transform="translate(0 0)"><text class="icon" x="48" y="65">★</text><text id="project-stars" class="value" x="76" y="67">4,931</text><text class="label" x="48" y="97">PROJECT STARS</text></g>
  <g transform="translate(225 0)"><text class="icon" x="48" y="65">◆</text><text class="value" x="76" y="67">326</text><text class="label" x="48" y="97">SCHOLAR CITATIONS</text></g>
  <g transform="translate(450 0)"><text class="icon" x="48" y="65">●</text><text class="value" x="76" y="67">4,790</text><text class="label" x="48" y="97">COMMITS</text></g>
  <g transform="translate(675 0)"><text class="icon" x="48" y="65">▣</text><text class="value" x="76" y="67">10</text><text class="label" x="48" y="97">RESEARCH REPOS</text></g>
</svg>
