<svg xmlns="http://www.w3.org/2000/svg" width="900" height="150" viewBox="0 0 900 150" role="img" aria-labelledby="title desc">
  <title id="title">Yuyang Hu — Research and GitHub statistics</title>
  <desc id="desc">4,990 project stars, 4,790 commits, and contributions to 6 repositories in the last year</desc>
  <style>
    .value{font:700 30px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;fill:#172033}.label{font:500 12px -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;fill:#687386;letter-spacing:.8px}.icon{font:400 18px -apple-system,BlinkMacSystemFont,Segoe UI Symbol,Arial,sans-serif;fill:#2a9d8f}.frame{fill:#fff;stroke:#d8dee8}.line{stroke:#e8ecf2}
    @media(prefers-color-scheme:dark){.value{fill:#e6edf3}.label{fill:#8b949e}.icon{fill:#5eead4}.frame{fill:#0d1117;stroke:#30363d}.line{stroke:#30363d}}
  </style>
  <rect class="frame" x=".5" y=".5" width="899" height="149" rx="10"/>
  <line class="line" x1="300" y1="27" x2="300" y2="123"/>
  <line class="line" x1="600" y1="27" x2="600" y2="123"/>
  <g><text class="icon" x="79" y="65">★</text><text id="project-stars" class="value" x="107" y="67">4,990</text><text class="label" x="79" y="97">PROJECT STARS</text></g>
  <g transform="translate(300 0)"><text class="icon" x="91" y="65">●</text><text class="value" x="119" y="67">4,790</text><text class="label" x="91" y="97">TOTAL COMMITS</text></g>
  <g transform="translate(600 0)"><text class="icon" x="96" y="65">▣</text><text class="value" x="124" y="67">6</text><text class="label" x="96" y="97">CONTRIBUTED REPOS · 1Y</text></g>
</svg>
